[package]
name = "citreaanalysis"
version = "0.1.0"
edition = "2021"

[dependencies]
bitcoincore-rpc = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
ctrlc = "3.4"
rayon = "1.10"
log = "0.4"
env_logger = "0.10"

[[bin]]
name = "citread"
path = "src/bin/citread.rs"
